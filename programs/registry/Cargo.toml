[package]
name = "solanapilot_registry"
version = "0.1.0"
description = "SolanaPilot Registry - On-chain registry for AI-generated Solana programs"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.0"
proc-macro-crate = "=3.1.0"
indexmap = "=2.6.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
